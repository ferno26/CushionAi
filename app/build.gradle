plugins { id 'com.android.application' }

android {
    namespace 'com.cushionlab.autoguide'
    compileSdk 35
    defaultConfig {
        applicationId 'com.cushionlab.autoguide'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '4.1-diagnostics'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
