name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Ball Pool Guide 5.0 source
        run: unzip -oq cushion-guide-v5.zip -d .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Run core smoke tests
        run: sh tests/run.sh
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify signed APK and prepare download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/CushionLab-BallPool-Guide-v5.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/CushionLab-BallPool-Guide-v5.apk
          cd dist
          sha256sum CushionLab-BallPool-Guide-v5.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CushionLab-BallPool-Guide-v5-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
